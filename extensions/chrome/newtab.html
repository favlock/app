<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening FavLock…</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-amber" aria-hidden="true"></div>
    <div class="ambient ambient-blue" aria-hidden="true"></div>
    <main class="newtab-setup">
      <img class="logo" src="favlock-logo.svg" alt="FavLock" />
      <section class="container" aria-labelledby="setup-title">
        <span class="heading-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M3 12h18" />
          </svg>
        </span>
        <p class="eyebrow">FavLock</p>
        <h1 id="setup-title">Opening your private library</h1>
        <p class="description">
          One moment while FavLock opens.
        </p>
      </section>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>

name: CI

on:
  push:
    branches:
      # - main # Temporarily disabled while working solo.
      - production
  pull_request:
    branches:
      # - main # Temporarily disabled while working solo.
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    # Manual runs are also limited to production while main CI is disabled.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAVLOCK_USE_TEST_ENV: "1"
      VITE_AUTH_URL: "https://auth.favlock.example"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build dashboard
        run: npm run build

      - name: Build Chrome extension
        run: npm run build:chrome
